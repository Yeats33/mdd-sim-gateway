name: Native Apps Release

on:
  push:
    tags:
      - 'v1.0.0'

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.9
  APP_VERSION: 1.0.0

jobs:
  android:
    name: Signed Android arm64-v8a APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag and Android signing secrets
        env:
          PRIVATE_KEY: ${{ secrets.ANDROID_RELEASE_PRIVATE_KEY_BASE64 }}
          CERTIFICATE: ${{ secrets.ANDROID_RELEASE_CERTIFICATE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = "v$APP_VERSION"
          test -n "$PRIVATE_KEY"
          test -n "$CERTIFICATE"
          test -n "$KEY_PASSWORD"
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          printf '%s\n' "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore Android signing key and certificate
        env:
          PRIVATE_KEY: ${{ secrets.ANDROID_RELEASE_PRIVATE_KEY_BASE64 }}
          CERTIFICATE: ${{ secrets.ANDROID_RELEASE_CERTIFICATE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$PRIVATE_KEY" | openssl base64 -d -A -out "$RUNNER_TEMP/android-release-private-key.pk8"
          printf '%s' "$CERTIFICATE" | openssl base64 -d -A -out "$RUNNER_TEMP/android-release-certificate.pem"
          printf '%s\n' "$KEY_PASSWORD" > "$RUNNER_TEMP/android-release-key-password"
          chmod 0600 "$RUNNER_TEMP/android-release-private-key.pk8" \
            "$RUNNER_TEMP/android-release-certificate.pem" \
            "$RUNNER_TEMP/android-release-key-password"
      - name: Build and verify signed APK
        env:
          MDD_ANDROID_PRIVATE_KEY: ${{ runner.temp }}/android-release-private-key.pk8
          MDD_ANDROID_CERTIFICATE: ${{ runner.temp }}/android-release-certificate.pem
          MDD_ANDROID_KEY_PASSWORD_FILE: ${{ runner.temp }}/android-release-key-password
        run: ./tools/build-android-apk.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-android
          path: dist/android/mdd-sim-gateway-1.0.0-android-arm64-v8a.apk
          if-no-files-found: error

  ios:
    name: Signed iOS IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Apple signing secrets
        env:
          CERTIFICATE: ${{ secrets.APPLE_IOS_DISTRIBUTION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = "v$APP_VERSION"
          test -n "$CERTIFICATE"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$PROFILE"
          test -n "$TEAM_ID"
          test -n "$KEYCHAIN_PASSWORD"
          test -n "$EXPORT_METHOD"
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          printf '%s\n' "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install iOS certificate and profile
        env:
          CERTIFICATE: ${{ secrets.APPLE_IOS_DISTRIBUTION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -eu
          printf '%s' "$CERTIFICATE" | openssl base64 -d -A -out "$RUNNER_TEMP/ios-distribution.p12"
          printf '%s' "$PROFILE" | openssl base64 -d -A -out "$RUNNER_TEMP/mdd-ios.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security import "$RUNNER_TEMP/ios-distribution.p12" \
            -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/release.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db"
          security cms -D -i "$RUNNER_TEMP/mdd-ios.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          install -m 0600 "$RUNNER_TEMP/mdd-ios.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          printf 'MDD_IOS_PROFILE_NAME=%s\n' "$profile_name" >> "$GITHUB_ENV"
      - name: Create export options
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
        run: |
          plutil -create xml1 "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert method -string "$EXPORT_METHOD" "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert signingStyle -string manual "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert teamID -string "$TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert provisioningProfiles -xml \
            "<dict><key>com.yeats33.mdd.gateway.ios</key><string>$MDD_IOS_PROFILE_NAME</string></dict>" \
            "$RUNNER_TEMP/ExportOptions.plist"
      - name: Build signed IPA
        working-directory: clients/mdd_gateway_app
        env:
          MDD_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build ipa --release --build-name "$APP_VERSION" --build-number 1 \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          ipa=$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)
          test -n "$ipa"
          mkdir -p ../../dist/ios
          install -m 0644 "$ipa" "../../dist/ios/mdd-sim-gateway-$APP_VERSION-ios.ipa"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-ios
          path: dist/ios/mdd-sim-gateway-1.0.0-ios.ipa
          if-no-files-found: error

  macos:
    name: Signed and notarized macOS DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Apple signing and notarization secrets
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = "v$APP_VERSION"
          test -n "$CERTIFICATE"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          test -n "$NOTARY_KEY"
          test -n "$NOTARY_KEY_ID"
          test -n "$NOTARY_ISSUER_ID"
      - name: Install Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          printf '%s' "$CERTIFICATE" | openssl base64 -d -A -out "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$NOTARY_KEY" | openssl base64 -d -A -out "$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/release.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db"
          identity=$(security find-identity -v -p codesigning "$RUNNER_TEMP/release.keychain-db" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          test -n "$identity"
          printf 'MDD_MACOS_SIGNING_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"
      - name: Install pinned Flutter SDK and Lima
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          printf '%s\n' "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          brew install lima
      - name: Build and sign Mac app
        env:
          MDD_LIMA_BIN: /opt/homebrew/bin/limactl
        run: |
          flutter config --no-analytics
          ./tools/build-macos-app.sh
          app="clients/mdd_gateway_app/build/macos/Build/Products/Release/MDD Sim Gateway.app"
          test -d "$app"
          codesign --force --options runtime --timestamp --sign "$MDD_MACOS_SIGNING_IDENTITY" \
            "$app/Contents/Resources/mdd-hostd"
          codesign --force --options runtime --timestamp --sign "$MDD_MACOS_SIGNING_IDENTITY" \
            "$app/Contents/Resources/limactl"
          codesign --deep --force --options runtime --timestamp \
            --entitlements clients/mdd_gateway_app/macos/Runner/Release.entitlements \
            --sign "$MDD_MACOS_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p dist/macos/dmg-root
          ditto "$app" "dist/macos/dmg-root/MDD Sim Gateway.app"
          ln -s /Applications "dist/macos/dmg-root/Applications"
          hdiutil create -volname 'MDD Sim Gateway' -srcfolder dist/macos/dmg-root \
            -ov -format UDZO "dist/macos/mdd-sim-gateway-$APP_VERSION-macos-arm64.dmg"
          codesign --force --timestamp --sign "$MDD_MACOS_SIGNING_IDENTITY" \
            "dist/macos/mdd-sim-gateway-$APP_VERSION-macos-arm64.dmg"
      - name: Notarize and staple DMG
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          dmg="dist/macos/mdd-sim-gateway-$APP_VERSION-macos-arm64.dmg"
          xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-macos
          path: dist/macos/mdd-sim-gateway-1.0.0-macos-arm64.dmg
          if-no-files-found: error

  publish:
    name: Publish one GitHub Release
    needs: [android, ios, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets and checksums
        run: |
          set -eu
          test -f release-assets/mdd-sim-gateway-1.0.0-android-arm64-v8a.apk
          test -f release-assets/mdd-sim-gateway-1.0.0-ios.ipa
          test -f release-assets/mdd-sim-gateway-1.0.0-macos-arm64.dmg
          cd release-assets
          sha256sum mdd-sim-gateway-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "MDD Sim Gateway v1.0.0" \
            --notes-file docs/RELEASE_NOTES_v1.0.0.md
