name: Native Apps Release

on:
  push:
    branches:
      - 'release/v1.0.6'
    tags:
      - 'v1.0.6'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  FLUTTER_VERSION: 3.44.9
  APP_VERSION: 1.0.6

jobs:
  android:
    name: Signed Android arm64-v8a APK
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag and Android signing secrets
        env:
          PRIVATE_KEY: ${{ secrets.ANDROID_RELEASE_PRIVATE_KEY_BASE64 }}
          CERTIFICATE: ${{ secrets.ANDROID_RELEASE_CERTIFICATE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -eu
          test "$GITHUB_REF_TYPE" != tag || test "$GITHUB_REF_NAME" = "v$APP_VERSION"
          test -n "$PRIVATE_KEY"
          test -n "$CERTIFICATE"
          test -n "$KEY_PASSWORD"
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          printf '%s\n' "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore Android signing key and certificate
        env:
          PRIVATE_KEY: ${{ secrets.ANDROID_RELEASE_PRIVATE_KEY_BASE64 }}
          CERTIFICATE: ${{ secrets.ANDROID_RELEASE_CERTIFICATE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$PRIVATE_KEY" | openssl base64 -d -A -out "$RUNNER_TEMP/android-release-private-key.pk8"
          printf '%s' "$CERTIFICATE" | openssl base64 -d -A -out "$RUNNER_TEMP/android-release-certificate.pem"
          printf '%s\n' "$KEY_PASSWORD" > "$RUNNER_TEMP/android-release-key-password"
          chmod 0600 "$RUNNER_TEMP/android-release-private-key.pk8" \
            "$RUNNER_TEMP/android-release-certificate.pem" \
            "$RUNNER_TEMP/android-release-key-password"
      - name: Build and verify signed APK
        env:
          MDD_ANDROID_PRIVATE_KEY: ${{ runner.temp }}/android-release-private-key.pk8
          MDD_ANDROID_CERTIFICATE: ${{ runner.temp }}/android-release-certificate.pem
          MDD_ANDROID_KEY_PASSWORD_FILE: ${{ runner.temp }}/android-release-key-password
        run: ./tools/build-android-apk.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-android
          path: dist/android/mdd-sim-gateway-1.0.6-android-arm64-v8a.apk
          if-no-files-found: error

  ios:
    name: Unsigned iOS IPA
    if: github.ref_type == 'tag'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag and Apple Silicon builder
        run: |
          set -eu
          test "$GITHUB_REF_TYPE" != tag || test "$GITHUB_REF_NAME" = "v$APP_VERSION"
          test "$(uname -m)" = arm64
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          printf '%s\n' "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build and verify unsigned IPA
        run: |
          flutter config --no-analytics
          ./tools/build-ios-ipa.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-ios
          path: dist/ios/mdd-sim-gateway-1.0.6-ios-unsigned.ipa
          if-no-files-found: error

  macos:
    name: Ad-hoc signed macOS DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag and Apple Silicon builder
        run: |
          set -eu
          test "$GITHUB_REF_TYPE" != tag || test "$GITHUB_REF_NAME" = "v$APP_VERSION"
          test "$(uname -m)" = arm64
      - name: Install pinned Flutter SDK and Lima
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          printf '%s\n' "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          rustup target add aarch64-apple-darwin
          if brew tap 2>/dev/null | grep -Fxq 'aws/tap'; then
            brew untap aws/tap
          fi
          brew install lima
      - name: Build and ad-hoc sign Mac app
        env:
          MDD_LIMA_BIN: /opt/homebrew/bin/limactl
        run: |
          set -eu
          flutter config --no-analytics
          ./tools/build-macos-app.sh
          app="clients/mdd_gateway_app/build/macos/Build/Products/Release/MDD Sim Gateway.app"
          test -d "$app"
          ./tools/sign-macos-app-adhoc.sh "$app" \
            clients/mdd_gateway_app/macos/Runner/Release.entitlements
          ./tools/smoke-macos-hostd.sh "$app"
          MDD_MACOS_SMOKE_LOG="$RUNNER_TEMP/mdd-sim-gateway-smoke.log" \
            ./tools/smoke-macos-app.sh "$app"
          mkdir -p dist/macos/dmg-root
          ditto "$app" "dist/macos/dmg-root/MDD Sim Gateway.app"
          ln -s /Applications "dist/macos/dmg-root/Applications"
          dmg="dist/macos/mdd-sim-gateway-$APP_VERSION-macos-arm64-ad-hoc.dmg"
          hdiutil create -volname 'MDD Sim Gateway' -srcfolder dist/macos/dmg-root \
            -ov -format UDZO "$dmg"
          hdiutil verify "$dmg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-macos
          path: dist/macos/mdd-sim-gateway-1.0.6-macos-arm64-ad-hoc.dmg
          if-no-files-found: error

  publish:
    name: Publish one GitHub Release
    if: github.ref_type == 'tag'
    needs: [android, ios, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download native artifacts without a JavaScript action runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          for artifact in native-android native-ios native-macos; do
            gh run download "$GITHUB_RUN_ID" --name "$artifact" \
              --dir release-assets --repo "$GITHUB_REPOSITORY"
          done
      - name: Verify assets and checksums
        run: |
          set -eu
          test -f release-assets/mdd-sim-gateway-1.0.6-android-arm64-v8a.apk
          test -f release-assets/mdd-sim-gateway-1.0.6-ios-unsigned.ipa
          test -f release-assets/mdd-sim-gateway-1.0.6-macos-arm64-ad-hoc.dmg
          cd release-assets
          sha256sum mdd-sim-gateway-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish v1.0.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "MDD Sim Gateway v1.0.6" \
            --notes-file docs/RELEASE_NOTES_v1.0.6.md
