name: iOS native client

on:
  push:
    branches: [platform/ios]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm Apple Silicon builder
        run: test "$(uname -m)" = arm64
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.44.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          printf '%s\n' "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Analyze and test shared Dart code
        working-directory: clients/mdd_gateway_app
        run: |
          flutter config --no-analytics
          flutter pub get
          dart analyze
          flutter test
      - name: Compile unsigned iOS release
        working-directory: clients/mdd_gateway_app
        run: |
          xcodebuild -version
          flutter build ios --release --no-codesign
          test -d build/ios/iphoneos/Runner.app
