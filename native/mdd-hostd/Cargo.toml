[package]
name = "mdd-hostd"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Apple Silicon VM and Docker supervisor for MDD Sim Gateway"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
hex = "0.4"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.49", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2.1"
uuid = { version = "1.21", features = ["v4"] }

[dev-dependencies]
tempfile = "3.24"
